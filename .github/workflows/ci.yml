name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc -b

      - name: Build
        run: pnpm build

      - name: Build scoring engine (SSR bundle)
        run: pnpm exec vite build --ssr scripts/engine-entry.ts --outDir .tmp-ssr

      - name: Run deterministic scoring tests
        run: node scripts/test-scoring.mjs

      - name: Run deterministic receipt tests
        run: node scripts/test-receipt.mjs